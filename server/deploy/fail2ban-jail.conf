# fail2ban jail for Mèche (docs/09). Copy to /etc/fail2ban/jail.d/meche.conf,
# then `sudo systemctl reload fail2ban`. 10 failures within an hour: banned for a day.
# The API already limits logins to 5 per minute per address; this bans the persistent ones.
[meche]
enabled  = true
port     = http,https
filter   = meche
# Read the log file, whatever the default backend (Ubuntu 24.04 sets `backend = systemd` for
# every jail, which ignores logpath; 26.04 only for sshd).
backend  = auto
logpath  = /var/www/meche/server/storage/logs/auth.log
logtimezone = UTC
maxretry = 10
findtime = 1h
bantime  = 1d
