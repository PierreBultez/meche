; OPcache is shared by every PHP-FPM pool (docs/09, step 7). Without this line, the PHP of
; another site could include a file of Mèche that OPcache already holds (such as
; bootstrap/cache/config.php: database password, APP_KEY) without being allowed to read it.
; It applies to every site: one permission check per included file.
; Copy to /etc/php/8.5/fpm/conf.d/99-opcache-isolation.ini, then restart PHP-FPM.
opcache.validate_permission = 1
