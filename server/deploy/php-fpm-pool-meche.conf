; PHP-FPM pool of Mèche (docs/09): its own workers, socket and settings, without changing the
; other sites served by PHP 8.5. Copy to /etc/php/8.5/fpm/pool.d/meche.conf, then
; `sudo php-fpm8.5 -t` (configuration test) and `sudo systemctl reload php8.5-fpm`.
[meche]
; www-data, like the cron and the permissions of storage/ (docs/09, step 4).
user = www-data
group = www-data
listen = /run/php/php8.5-fpm-meche.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Started on demand: a personal server gets a few requests a minute. A worker stops after 30 s
; without work, and is replaced after 500 requests.
pm = ondemand
pm.max_children = 8
pm.process_idle_timeout = 30s
pm.max_requests = 500

; A sync request: up to about 8 MB of notes, JSON escaping included.
php_admin_value[post_max_size] = 16M
php_admin_value[memory_limit] = 256M
; Do not announce the PHP version in every answer.
php_admin_flag[expose_php] = off
