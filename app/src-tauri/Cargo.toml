[package]
name = "meche"
version = "0.4.0"
description = "Mèche — fast, colorful personal notes with self-destructing notes"
authors = ["Pierre Bultez"]
license = "MIT"
edition = "2024"
rust-version = "1.95"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "meche_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# "functions": Rust functions callable from SQL (the search index uses one, see db/search.rs).
rusqlite = { version = "0.40", features = ["bundled", "functions"] }
rusqlite_migration = "2.6"
thiserror = "2"
uuid = { version = "1.28", features = ["v7"] }
tauri-plugin-opener = "2"
# HTTP client of the sync (docs/04). rustls instead of OpenSSL; certificates are checked with the
# system's trust store (rustls-platform-verifier). "no-provider": the cryptography is ring,
# installed at startup (sync/api.rs), which builds with a plain C compiler on every target.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "gzip", "system-proxy"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# Tauri already runs tokio; "time" adds the timers the sync waits with, "sync" the channels
# the commands talk to the sync engine with.
tokio = { version = "1.54", features = ["sync", "time"] }
# Local date and time (the « (conflit du 22/10 14:05) » suffix): the standard library has no time zones.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
# File chooser of the Standard Notes import (docs/07), opened by Rust only.
tauri-plugin-dialog = "2.8.3"
# Standard Notes saves its backup as a zip. Reading deflate only (what it uses): no encryption,
# no other compression. The deflate code is flate2 with its zlib-rs backend, both already in the
# build (reqwest's gzip); naming the backend keeps the crate building without them.
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3"
