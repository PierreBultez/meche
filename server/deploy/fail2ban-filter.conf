# fail2ban filter for Mèche (docs/09). Copy to /etc/fail2ban/filter.d/meche.conf.
# Matches the lines written by the API in storage/logs/auth.log:
#   [2026-10-23 14:05:00] production.WARNING: Failed login {"ip":"203.0.113.7"}
#   [2026-10-23 14:05:00] production.WARNING: Failed invitation code {"ip":"203.0.113.7"}
[Definition]
failregex = ^\[[^\]]+\] \S+\.WARNING: Failed (?:login|invitation code) \{"ip":"<HOST>"\}
datepattern = ^\[%%Y-%%m-%%d %%H:%%M:%%S\]
