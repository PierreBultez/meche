# Apache vhost of the Mèche API (docs/09). Copy to /etc/apache2/sites-available/meche.conf,
# then `sudo a2ensite meche`. Certbot adds the HTTPS vhost (meche-le-ssl.conf) from this one.
<VirtualHost *:80>
    ServerName meche.pierrebultez.com

    # Only server/public is served: .env, the code and .git stay out of reach.
    DocumentRoot /var/www/meche/server/public

    <Directory /var/www/meche/server/public>
        AllowOverride None
        Require all granted
        Options -Indexes -MultiViews

        # Laravel's front controller (replaces public/.htaccess, which is not read here).
        RewriteEngine On
        RewriteCond %{HTTP:Authorization} .
        RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [L]
    </Directory>

    # PHP 8.5 through PHP-FPM (the pool of /etc/php/8.5/fpm/pool.d/www.conf).
    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php8.5-fpm.sock|fcgi://localhost"
    </FilesMatch>

    # A sync request carries at most about 4 MB of notes (docs/04): 20 MB leaves room for JSON.
    LimitRequestBody 20971520

    # Compressed JSON answers (docs/04, performance).
    AddOutputFilterByType DEFLATE application/json

    ErrorLog ${APACHE_LOG_DIR}/meche-error.log
    CustomLog ${APACHE_LOG_DIR}/meche-access.log combined
</VirtualHost>
