# Deploys the server on Pierre's VPS (docs/09): on a push to master that touches server/, or
# by hand from the Actions tab. The tests run first; nothing is deployed if they fail.
#
# The repository is public: the address of the server and the SSH key are GitHub secrets
# (environment "production", restricted to the master branch), never written here.
#   DEPLOY_HOST, DEPLOY_PORT, DEPLOY_USER  where to connect
#   DEPLOY_SSH_KEY                         private key of the deploy key pair
#   DEPLOY_KNOWN_HOSTS                     `ssh-keyscan -p <port> <host>`: the server's identity
# On the server, that key can only run server/deploy/forced-command.sh, which deploys a commit
# already on origin/master: whatever this workflow sends, it can do nothing else.
name: Deploy server

on:
  push:
    branches: [master]
    paths:
      - "server/**"
      - ".github/workflows/deploy-server.yml"
      - ".github/workflows/server-tests.yml"
      - "scripts/check-licenses.mjs"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer one waits instead of interrupting a migration.
concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/server-tests.yml

  deploy:
    name: Deploy
    needs: tests
    # Only master is deployed, even when the workflow is started by hand from another branch.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The server's forced command reads the commit id and deploys it.
          ssh -i ~/.ssh/deploy_key -p "$PORT" -o BatchMode=yes "$DEPLOY_USER@$HOST" "$GITHUB_SHA"
