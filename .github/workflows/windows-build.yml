# Builds the Windows installer (NSIS) of the app, to try it on a PC (docs/09, § 4): by hand from
# the Actions tab (Windows build › Run workflow), and on every push that changes this file. The
# installer is attached to the run as an artifact (a zip to download from the run's page).
# A first piece of phase 6: release.yml will build every platform on a v* tag, with the
# updater's signature. Not signed (Windows code signing is paid): SmartScreen warns once.
name: Windows build

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/windows-build.yml"

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows installer (NSIS)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - run: npm ci
      # The .exe installer only: the .msi needs WiX and adds nothing for a try. `npx` rather than
      # `npm run tauri build -- …`: PowerShell, the default shell here, may swallow the `--`.
      - run: npx tauri build --bundles nsis

      - uses: actions/upload-artifact@v6
        with:
          name: meche-windows-x64
          path: app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
