; PHP settings for Mèche (docs/09). Copy to /etc/php/8.5/fpm/conf.d/90-meche.ini,
; then `sudo systemctl reload php8.5-fpm`.

; A sync request: up to about 4 MB of notes, JSON escaping included.
post_max_size = 16M
memory_limit = 256M

; Do not announce the PHP version in every answer.
expose_php = Off

; OPcache is on by default on Ubuntu; the deployment reloads PHP-FPM, which empties it.
opcache.enable = 1
