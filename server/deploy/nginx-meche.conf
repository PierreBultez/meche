# Nginx site of the Mèche API (docs/09). Copy to /etc/nginx/sites-available/meche, link it:
#   sudo ln -s /etc/nginx/sites-available/meche /etc/nginx/sites-enabled/meche
# then `sudo nginx -t` and `sudo systemctl reload nginx`. `certbot --nginx` then adds HTTPS
# (listen 443, certificates) and the redirect from http to this file.
server {
    listen 80;
    listen [::]:80;
    server_name meche.pierrebultez.com;

    # Only server/public is served: .env, the code and .git stay out of reach.
    root /var/www/meche/server/public;
    index index.php;
    charset utf-8;

    # A sync request carries at most about 8 MB of notes (docs/04): 20 MB leaves room for JSON.
    client_max_body_size 20m;
    # No Nginx version in the answers.
    server_tokens off;

    # Compressed JSON answers (docs/04, performance). Ubuntu's nginx.conf turns gzip on but
    # compresses only text/html by default.
    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;
    gzip_vary on;

    # Laravel's front controller: every address that is not a file goes to index.php.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # PHP 8.5 through PHP-FPM (the pool of /etc/php/8.5/fpm/pool.d/www.conf). Only index.php:
    # no other PHP file is ever run.
    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
    }
    location ~ \.php$ {
        return 404;
    }

    # Hidden files (.env, .git…) are never served; .well-known stays open for Certbot.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /var/log/nginx/meche-access.log;
    error_log /var/log/nginx/meche-error.log;
}
