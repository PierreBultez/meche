# Checks run on every push and pull request (docs/10, phase 0).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A new push on the same branch cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck, Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - name: Check dependency licenses (CLAUDE.md rule 3)
        run: node ../scripts/check-licenses.mjs npm

  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@v5

      # A stuck package mirror once blocked this step for over 15 minutes: fail fast and retry.
      - name: Install Tauri system dependencies
        timeout-minutes: 10
        run: |
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get $APT_OPTS update
          # Recommended packages (GStreamer plugins, codecs) are not needed to compile and test.
          sudo apt-get $APT_OPTS install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Check dependency licenses (CLAUDE.md rule 3)
        run: node ../../scripts/check-licenses.mjs cargo
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
